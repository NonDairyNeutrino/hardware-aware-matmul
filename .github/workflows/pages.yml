name: Pages

# Builds the site (the wasm modules and the Astro project) and deploys it to GitHub
# Pages. One manual step for the repository owner: Settings > Pages > Source =
# "GitHub Actions". It runs on request, on every push to `trunk` (which deploys the
# site, except for pushes that only touch the plans and specs under docs/superpowers/),
# and on pull requests (build only, no deploy).
on:
  workflow_dispatch:
  push:
    branches: [ "trunk" ]
    paths-ignore:
      - "docs/superpowers/**"
  pull_request:
    branches: [ "trunk" ]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Must equal the `wasm-bindgen` pin in web/wasm/Cargo.toml.
  WASM_BINDGEN_VERSION: "0.2.130"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Install the Rust toolchains (the pinned nightly for the threaded build, stable for the rest)
      run: rustup toolchain install stable nightly-2025-11-15 --profile minimal -c rust-src -t wasm32-unknown-unknown

    - name: Cache the wasm-bindgen CLI
      id: wasm-bindgen
      uses: actions/cache@v4
      with:
        path: ~/.cargo/bin/wasm-bindgen
        key: wasm-bindgen-cli-${{ env.WASM_BINDGEN_VERSION }}

    - name: Install the wasm-bindgen CLI
      if: steps.wasm-bindgen.outputs.cache-hit != 'true'
      run: cargo install wasm-bindgen-cli --version =${{ env.WASM_BINDGEN_VERSION }} --locked

    - name: Build the threaded wasm module (bundler mode)
      working-directory: web/wasm
      env:
        FEATURES: threads
      run: ./build.sh

    - name: Build the lite wasm module (stable and single-threaded, for the step-through)
      working-directory: web/wasm
      run: ./build-lite.sh

    - name: Test the wasm wrapper natively (without and with the threads feature)
      working-directory: web/wasm
      run: |
        cargo test
        cargo test --features threads

    - name: Test the results assembler
      run: python3 -I web/dev/test_results.py

    - name: Generate the expected hashes for the gate page
      working-directory: web/wasm
      run: |
        mkdir -p ../site/public
        cargo run --release --example expected > ../site/public/expected.json

    - uses: actions/setup-node@v4
      with:
        # The local Docker image is node:latest (v26 when this was written).
        node-version: 26
        cache: npm
        cache-dependency-path: web/site/package-lock.json

    - name: Install, test, build and check the site
      working-directory: web/site
      run: |
        npm ci
        npm test
        npm run build
        npm run check

    - uses: actions/upload-pages-artifact@v3
      with:
        path: web/site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v4
